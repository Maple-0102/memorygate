[project]
name = "memorygate"
version = "0.1.0"
description = "Evaluating memory updates for SQL agents with a regression gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
memorygate = "memorygate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorygate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
